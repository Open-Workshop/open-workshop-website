{% set is_modpack_edit = (edit_page.entity_kind | default('mod')) == 'modpack' %}
{% set view_href = '/modpack/' ~ info['id'] if is_modpack_edit else '/mod/' ~ info['id'] %}
{% set view_title = 'Открыть страницу модпака' if is_modpack_edit else 'Открыть страницу мода' %}
<div class="standart-panel mod-edit-nav">
  <a class="mod-edit-nav__save dark button-style" href="{{ view_href }}" title="{{ view_title }}">
    <img src="/assets/images/svg/white/eye.svg" style="padding: 5px;" alt="{{ view_title }}">
  </a>

  <div class="navigation mod-edit-nav__group" variants="in-mod-page, in-catalog-view, params-mod">
    <button id="start-page-button" class="dark" variant="in-mod-page" data-action="pager-change">
      <img src="/assets/images/home-ico.svg" alt="Иконка 'домой'">
    </button>
    <button variant="in-catalog-view" class="dark" data-action="pager-change">
      <img src="/assets/images/image-ico.svg" alt="Иконка 'каталог'">
    </button>
    <button variant="params-mod" class="dark" data-action="pager-change">
      <img src="/assets/images/params-ico.svg" alt="Иконка 'параметры'">
    </button>
  </div>

  <button class="mod-edit-nav__save" data-action="mod-save">
    <img src="/assets/images/save-ico.svg" alt="Иконка 'сохранить'">
  </button>
</div>
